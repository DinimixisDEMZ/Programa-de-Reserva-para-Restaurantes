{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión | Restaurante Elegante</title>
    <!-- Bootstrap CSS CDN -->
    <link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet">
    <!-- Bootstrap Icons CDN -->
    <link rel="stylesheet" href="{% static 'font/bootstrap-icons.min.css' %}">
    <!-- Inter Font -->
    <link rel="stylesheet" href="{% static 'font/css2.css' %}">
    <style>
        :root {
            --primary-color: #5e3a1f;
            --secondary-color: #c8a97e;
            --accent-color: #e8c284;
            --light-bg: #f9f5f0;
            --dark-text: #2a2118;
            --light-text: #f8f9fa;
            --error-color: #dc3545; /* Rojo para errores */
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--light-bg);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            /* Estilos para la imagen de fondo */
            background-image: url('{% static '/images/Sala.png' %}'); /* Imagen de fondo de tu restaurante */
            background-size: cover; /* Cubre todo el fondo */
            background-position: center; /* Centra la imagen */
            background-attachment: fixed; /* Hace que la imagen de fondo sea fija al hacer scroll */
            backdrop-filter: blur(3px); /* Un ligero desenfoque para que el formulario resalte */
            -webkit-backdrop-filter: blur(3px); /* Para compatibilidad con Safari */
        }

        .auth-container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            padding: 3rem;
            width: 100%;
            max-width: 450px; /* Ajustado para formularios de autenticación */
            text-align: center;
        }

        .section-title {
            position: relative;
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--primary-color);
            margin-bottom: 1.5rem; /* Menos margen para subtítulo */
            text-align: center;
        }
        
        .section-title:after {
            content: '';
            display: block;
            width: 80px;
            height: 4px;
            background: var(--secondary-color);
            margin: 15px auto 2.5rem auto; /* Ajustado para subtítulo */
        }

        .auth-subtitle {
            color: var(--dark-text);
            margin-bottom: 2rem;
            font-size: 1.1rem;
        }
        
        .form-group {
            margin-bottom: 1.5rem;
            text-align: left; /* Alinea etiquetas a la izquierda */
        }
        
        .form-label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.8rem;
            color: var(--dark-text);
        }
        
        .form-control {
            border-radius: 8px;
            padding: 12px 15px;
            border: 1px solid #ddd;
            width: 100%;
            transition: all 0.3s ease;
        }
        
        .form-control:focus {
            border-color: var(--secondary-color);
            box-shadow: 0 0 0 0.25rem rgba(200, 169, 126, 0.25);
        }
        
        .btn-primary-custom {
            background-color: var(--primary-color);
            border: none;
            border-radius: 50px;
            padding: 12px 30px;
            font-weight: 600;
            letter-spacing: 0.5px;
            color: var(--light-text);
            transition: all 0.3s ease;
            width: 100%; /* Ocupa todo el ancho */
            margin-top: 1rem; /* Espacio superior */
        }
        
        .btn-primary-custom:hover {
            background-color: var(--secondary-color);
            transform: translateY(-2px);
            color: var(--dark-text);
        }

        .auth-footer {
            margin-top: 2.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid #eee;
        }

        .auth-footer p {
            color: #666;
            margin-bottom: 1rem;
        }

        .auth-link-custom {
            display: inline-block;
            padding: 10px 20px;
            background-color: var(--accent-color);
            color: var(--dark-text);
            border: 1px solid var(--secondary-color);
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .auth-link-custom:hover {
            background-color: var(--secondary-color);
            color: var(--light-text);
            transform: translateY(-2px);
        }

        /* Mensajes de error */
        .alert-error {
            background-color: #f8d7da; /* Fondo rojo claro */
            color: var(--error-color); /* Texto rojo oscuro */
            border: 1px solid #f5c6cb; /* Borde rojo */
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            font-size: 0.95rem;
            text-align: center;
        }

        @media (max-width: 768px) {
            body {
                padding: 1rem;
                align-items: flex-start;
            }
            .auth-container {
                padding: 2rem;
            }
            .section-title {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <main class="container">
        <section class="auth-container">
            <h2 class="section-title">Iniciar Sesión</h2>
            <p class="auth-subtitle">Bienvenido de vuelta a Bella Italia</p>

            {% if form.errors %}
            <div class="alert-error">
                Usuario o contraseña incorrectos. Por favor intente nuevamente.
            </div>
            {% endif %}

            <form method="POST" action="{% url 'login' %}">
                {% csrf_token %}
                
                <div class="form-group">
                    <label for="id_username" class="form-label">Usuario</label>
                    <input type="text" name="username" id="id_username" class="form-control" required autofocus>
                </div>
                
                <div class="form-group">
                    <label for="id_password" class="form-label">Contraseña</label>
                    <input type="password" name="password" id="id_password" class="form-control" required>
                </div>
                
                <button type="submit" class="btn btn-primary-custom">Entrar</button>
            </form>

            <div class="auth-footer">
                <p>¿No tienes una cuenta?</p>
                <a href="{% url 'signup' %}" class="auth-link-custom">Regístrate aquí</a>
            </div>
        </section>
    </main>
    <!-- Bootstrap Bundle con Popper -->
    <script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
</body>
</html>
