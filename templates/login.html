<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f2f2f2;
        }

        .login-container{
            width: 350px;
            margin: 100px auto;
            padding: 30px;
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        .login-container h2{
            text-align: center;
            margin-bottom: 20px;
        }

        .login-container label{
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .login-container input{
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .login-container button{
            width: 100%;
            padding: 12px;
            background-color: #5cb85c;
            border: none;
            color: #fff;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
        }

        .login-container button:hover{
            background-color: #4cae4c;
        }

        #error-message{
            color: red;
            text-align: center;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h2>Iniciar Sesión</h2>
        <form id="login-form" method="POST">
            {% csrf_token %}
            {{form}}
            <button type="submit">Entrar</button>
        </form>
        <p id="error-message">
            {% if messages %}
                {{message}}
            {% endif %}
        </p>
    </div>
</body>
</html>
