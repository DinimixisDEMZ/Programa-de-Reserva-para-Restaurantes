<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservaciones</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    /* Estilos personalizados */
    body {
      background-color: #f8f9fa;
    }
    .shadow-sm-custom {
      box-shadow: 0 .125rem .25rem rgba(0,0,0,.075)!important;
    }
    .table-responsive-custom {
      max-height: 400px; /* Altura máxima para la tabla con scroll */
      overflow-y: auto;
    }
    .carousel-item {
      height: 300px; /* Altura del carrusel */
      background-color: #6c757d; /* Color de fondo por defecto para slides sin imagen */
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 2em;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.5); /* Sombra para el texto del carrusel */
    }
    .carousel-item img {
      height: 100%;
      object-fit: cover;
    }
    .table-card {
      min-height: 180px; /* Altura mínima para las tarjetas de mesa */
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .table-card .card-body {
      flex-grow: 1;
    }
  </style>
</head>

<body>
    <h1>Reservaciones</h1>

    <ol>
        {% for reservation in reservations %}
            <li>{{reservation}}</li>
        {% endfor %}
    </ol>
    
</body>
</html>
