{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bella Italia - Reservas</title>
    <link href="{% static '/font/css2.css' %}" rel="stylesheet">
    <style>
        /* Mantengo todos tus estilos originales exactamente igual */
        :root {
            --italian-green: #009246;
            --italian-red: #ce2b37;
            --italian-gold: #d4af37;
            --cream: #faf8f5;
            --warm-white: #ffffff;
            --charcoal: #2c2c2c;
            --olive: #6b7c32;
            --terracotta: #c65d07;
            --sage: #9caf88;
        }
        /* ... (todo el CSS original permanece igual) ... */
    </style>
</head>
<body>
    <div class="container">
        <!-- Encabezado (sin cambios) -->
        <div class="header">
            <h1>🍝 Restaurante Bella Italia</h1>
            <p class="subtitle">Reservaciones</p>
            <p class="tagline">Bienvenidos a la Tradición Italiana</p>
        </div>

        <!-- Métricas (optimizadas para actualización dinámica) -->
        <div class="metrics-grid">
            <div class="metric-card">
                <div class="metric-header">
                    <span class="metric-title">Mesas Disponibles</span>
                    <span class="metric-icon">🟢</span>
                </div>
                <div class="metric-value green" id="available-tables">{{ tables_data|length }}</div>
            </div>
            <!-- ... otras métricas ... -->
        </div>

        <!-- Pestañas (sin cambios en estructura) -->
        <div class="tabs">
            <div class="tab-list">
                <button class="tab-button active" onclick="switchTab('tables')">🍷 Mesas</button>
                <button class="tab-button" onclick="switchTab('new-reservation')">📝 Nueva Reserva</button>
            </div>

            <!-- Contenido de pestañas (mejorado internamente) -->
            <div id="tables" class="tab-content active">
                <div class="status-legend">
                    <!-- ... leyenda de estados ... -->
                </div>
                <div id="tables-map" class="tables-section">
                    <!-- Mesas se generarán dinámicamente -->
                </div>
            </div>

            <div id="new-reservation" class="tab-content">
                <!-- Formulario (estructura original pero con mejor manejo de errores) -->
                <form id="reservation-form" action="{% url 'reservations:api_create_reservation' %}" method="post">
                    {% csrf_token %}
                    <!-- ... campos del formulario ... -->
                    <button type="submit" class="button button-primary">
                        🍝 Confirmar Reserva
                    </button>
                </form>
            </div>
        </div>
    </div>

    <script>
        // Datos iniciales (usando Django template tags)
        const tablesData = JSON.parse('{{ tables_data|escapejs }}');
        const reservationsData = JSON.parse('{{ reservations_data|escapejs }}');
        
        // Función mejorada para actualizar mesas
        function updateTablesMap() {
            const tablesMap = document.getElementById('tables-map');
            tablesMap.innerHTML = '';
            
            // Agrupar mesas por ubicación
            const groupedTables = tablesData.reduce((acc, table) => {
                const location = table.location || 'Sin ubicación';
                if (!acc[location]) acc[location] = [];
                acc[location].push(table);
                return acc;
            }, {});

            // Generar HTML para cada ubicación
            for (const [location, tables] of Object.entries(groupedTables)) {
                const locationSection = document.createElement('div');
                locationSection.className = 'location-card';
                locationSection.innerHTML = `
                    <div class="location-header">
                        <span>${getLocationIcon(location)}</span>
                        <span>${location}</span>
                    </div>
                    <div class="tables-grid">
                        ${tables.map(table => generateTableHTML(table)).join('')}
                    </div>
                `;
                tablesMap.appendChild(locationSection);
            }
        }

        // Helper para iconos de ubicación
        function getLocationIcon(location) {
            const icons = {
                "Terraza Vista Mar": "🌊",
                "Sala Principal": "🏛️",
                "Jardín Privado": "🌿",
                // ... otros iconos
            };
            return icons[location] || "🍽️";
        }

        // Generar HTML para cada mesa
        function generateTableHTML(table) {
            const reservation = reservationsData.find(r => r.table_id === table.id);
            return `
                <div class="table-item table-${table.status}" 
                     onclick="${table.status === 'available' ? `selectTable(${table.id})` : ''}">
                    <div class="table-header">
                        <span class="table-number">Mesa ${table.id}</span>
                        <span class="badge">👥 ${table.number_of_chairs}</span>
                    </div>
                    <div class="table-status">
                        <span class="badge ${getStatusClass(table.status)}">
                            ${getStatusText(table.status)}
                        </span>
                    </div>
                    ${reservation ? `
                        <div class="table-info">
                            <strong>${reservation.customer_name}</strong>
                            <div>${reservation.time} • ${reservation.guests} personas</div>
                        </div>
                    ` : ''}
                </div>
            `;
        }

        // Función para enviar reserva (mejorada)
        async function submitReservation(formData) {
            try {
                const response = await fetch('{% url "reservations:api_create_reservation" %}', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': '{{ csrf_token }}'
                    },
                    body: JSON.stringify(formData)
                });
                
                const data = await response.json();
                if (data.success) {
                    showSuccessMessage();
                    refreshData();
                } else {
                    showError(data.error || 'Error al crear reserva');
                }
            } catch (error) {
                showError('Error de conexión');
            }
        }

        // Inicialización
        document.addEventListener('DOMContentLoaded', function() {
            updateTablesMap();
            setupFormValidation();
            setupEventListeners();
        });

        /* ------------------------- */
        /* Funciones de utilidad     */
        /* (Manteniendo compatibilidad) */
        /* ------------------------- */
        
        // getCookie, getStatusText, getStatusClass, etc. se mantienen igual
        
        // Función original para cambiar pestañas
        function switchTab(tabName) {
            // ... implementación original ...
        }
        
        // Función original para seleccionar mesa
        function selectTable(tableId) {
            // ... implementación original ...
        }
    </script>
</body>
</html>
