{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Reservación</title>
    <!-- Bootstrap CSS CDN -->
    <link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet">
    <!-- Bootstrap Icons CDN -->
    <link rel="stylesheet" href="{% static 'font/bootstrap-icons.min.css' %}">
    <!-- Inter Font para una tipografía limpia y legible -->
    <link rel="stylesheet" href="{% static 'font/css2.css' %}">
 
    <style>
        :root {
            --primary-color: #5e3a1f;
            --secondary-color: #c8a97e;
            --accent-color: #e8c284;
            --light-bg: #f9f5f0;
            --dark-text: #2a2118;
            --light-text: #f8f9fa;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--light-bg);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }
        .section-title {
            position: relative;
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--primary-color);
            margin-bottom: 2.5rem;
            text-align: center;
        }
        .section-title:after {
            content: '';
            display: block;
            width: 80px;
            height: 4px;
            background: var(--secondary-color);
            margin: 15px auto;
        }
        .form-container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            padding: 3rem;
            width: 100%;
            max-width: 600px;
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        .form-label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.8rem;
            color: var(--dark-text);
        }
        .form-control {
            border-radius: 8px;
            padding: 12px 15px;
            border: 1px solid #ddd;
            width: 100%;
            transition: all 0.3s ease;
        }
        .form-control:focus {
            border-color: var(--secondary-color);
            box-shadow: 0 0 0 0.25rem rgba(200, 169, 126, 0.25);
        }
        .btn-primary-custom {
            background-color: var(--primary-color);
            border: none;
            border-radius: 50px;
            padding: 12px 30px;
            font-weight: 600;
            letter-spacing: 0.5px;
            color: var(--light-text);
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .btn-primary-custom:hover {
            background-color: var(--secondary-color);
            transform: translateY(-2px);
            color: var(--dark-text);
        }
        .btn-primary-custom i {
            margin-right: 0.5rem;
        }
        .btn-secondary-custom {
            background-color: var(--accent-color);
            border: none;
            border-radius: 50px;
            padding: 12px 30px;
            font-weight: 600;
            letter-spacing: 0.5px;
            color: var(--dark-text);
            transition: all 0.3s ease;
            margin-left: 1rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .btn-secondary-custom:hover {
            background-color: var(--secondary-color);
            transform: translateY(-2px);
            color: var(--light-text);
        }
        @media (max-width: 768px) {
            body {
                padding: 1rem;
                align-items: flex-start;
            }
            .section-title {
                font-size: 2rem;
            }
            .form-container {
                padding: 2rem;
            }
            .btn-group-responsive {
                flex-direction: column;
                align-items: center;
            }
            .btn-group-responsive .btn {
                margin-left: 0 !important;
                margin-bottom: 1rem;
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <!-- Contenedor Principal de Contenido -->
    <main class="container">
        <!-- Sección "Crear Nueva Reservación" (Formulario) -->
        <section id="create-reservation" class="form-container">
            <h2 class="section-title">Crear Nueva Reservación</h2>
            <form method="POST" class="mx-auto" style="max-width: 600px;">
                {% csrf_token %}
                
                {% for field in form %}
                    <div class="form-group">
                        <label for="{{ field.id_for_label }}" class="form-label">{{ field.label }}</label>
                        {{ field }}
                        {% if field.help_text %}
                            <small class="form-text text-muted">{{ field.help_text }}</small>
                        {% endif %}
                        {% for error in field.errors %}
                            <div class="text-danger">{{ error }}</div>
                        {% endfor %}
                    </div>
                {% endfor %}
                
                <!-- Botones para confirmar y volver -->
                <div class="text-center mt-4 btn-group-responsive">
                    <button type="submit" class="btn btn-primary-custom px-5">
                        <i class="bi bi-calendar-plus me-2"></i> Crear Reservación
                    </button>
                    <a href="{% url 'reservations:list_reservations' %}" class="btn btn-secondary-custom px-5">
                        <i class="bi bi-arrow-left-circle me-2"></i> Volver a Reservaciones
                    </a>
                </div>
            </form>
        </section>
    </main>

    <!-- Bootstrap Bundle con Popper -->
    <script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
</body>
</html>
